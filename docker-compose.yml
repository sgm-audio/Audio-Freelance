version: "3.9"

# ── Production override: docker compose -f docker-compose.yml -f docker-compose.prod.yml up ──
# Builds versioned local images by default; production may supply digest-pinned *_IMAGE variables.

services:
  # ── Embedding service (optional) ──
  ollama:
    # Stable release; set OLLAMA_IMAGE to a tested digest-pinned reference in production.
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.35.1}
    profiles: ["full"]
    ports:
      # Optional local model API; never publish it on non-loopback interfaces.
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ── FastAPI backend ──
  backend:
    image: ${BACKEND_IMAGE:-audio-freelance-backend:0.1.2}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - OLLAMA_HOST=http://ollama:11434
      - EMBEDDING_MODEL=nomic-embed-text
      - PREFERRED_NICHES=plugin_dev,reaper_scripts,rust_audio,audio_ml,game_audio_dev
      - MIN_RATE_CAD=3000
      - HOURLY_FLOOR_CAD=150
    volumes:
      - lead_data:/app/leads/data
    command: >
      sh -c "uv run python scripts/seed.py && uv run python main.py"

  # ── Next.js frontend ──
  frontend:
    image: ${FRONTEND_IMAGE:-audio-freelance-frontend:0.1.2}
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - API_HOST=backend
      - NEXT_TELEMETRY_DISABLED=1
    depends_on:
      - backend

  # ── SGM Outreach Engine (OUTREACH_BUILD_SPEC) — profile: outreach ──
  outreach:
    profiles: ["outreach"]
    build:
      context: .
      dockerfile: packages/cli/Dockerfile
    environment:
      - SGM_OUTREACH_DB=/data/outreach.sqlite
      - NODE_ENV=production
    volumes:
      - outreach_data:/data
      - ./inbox:/app/inbox:ro
      - ./config:/app/config:ro
    command: ["node", "packages/cli/dist/bin.js", "status"]

  n8n:
    profiles: ["outreach"]
    # Stable release; set N8N_IMAGE to a tested digest-pinned reference in production.
    image: ${N8N_IMAGE:-n8nio/n8n:2.41.6}
    ports:
      # The workflow editor is an operator-only local surface.
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_PORT=5678
      - GENERIC_TIMEZONE=America/Vancouver
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  ollama_data:
  lead_data:
  outreach_data:
  n8n_data:
